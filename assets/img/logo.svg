<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="АИС-расписание.РФ">
    <title>АИС-расписание.РФ</title>
    <desc>Логотип системы учёта посещаемости</desc>

    <defs>
        <linearGradient id="bgMain" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#4AA8FF"/>
            <stop offset="50%"  stop-color="#0A84FF"/>
            <stop offset="100%" stop-color="#5E5CE6"/>
        </linearGradient>

        <radialGradient id="glossCorner" cx="25%" cy="20%" r="60%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>

        <radialGradient id="bottomShade" cx="50%" cy="110%" r="70%">
            <stop offset="0%"   stop-color="rgba(0,0,0,0.28)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>

        <linearGradient id="tileBright" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E5EEFF"/>
        </linearGradient>

        <linearGradient id="tileSoft" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.68)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.32)"/>
        </linearGradient>

        <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#C9DEFF"/>
        </linearGradient>

        <filter id="appleShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
            <feOffset dx="0" dy="2" result="s1"/>
            <feComponentTransfer in="s1">
                <feFuncA type="linear" slope="0.35"/>
            </feComponentTransfer>
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="6" result="s2"/>
            <feComponentTransfer in="s2">
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="s2"/>
                <feMergeNode in="s1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2"/>
        </filter>
    </defs>

    <g filter="url(#appleShadow)">
        <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgMain)"/>
    </g>

    <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#glossCorner)"/>
    <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bottomShade)"/>

    <path d="M32 7 H88 Q113 7 113 32 V36 Q60 30 7 36 V32 Q7 7 32 7 Z"
          fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25"
          fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

    <rect x="34" y="34" width="24" height="24" rx="7" fill="url(#tileBright)"/>
    <rect x="34" y="34" width="24" height="24" rx="7" fill="none"
          stroke="rgba(255,255,255,0.6)" stroke-width="0.5"/>

    <rect x="62" y="34" width="24" height="24" rx="7" fill="url(#tileSoft)"/>
    <rect x="34" y="62" width="24" height="24" rx="7" fill="url(#tileSoft)"/>

    <path d="M64 74 L72 82 L88 62"
          fill="none"
          stroke="rgba(0,0,0,0.15)"
          stroke-width="8.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.4"
          filter="url(#softGlow)"
          transform="translate(0, 0.5)"/>

    <path d="M64 74 L72 82 L88 62"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="7.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M64 74 L72 82 L88 62"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.6"
          transform="translate(-0.5, -1)"/>
</svg>